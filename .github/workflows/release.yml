name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: version
        run: |
          CHANGED=false
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${HEAD_SHA}^"
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '^(package.json|src-tauri/tauri.conf.json|src-tauri/Cargo.toml)$'; then
            CHANGED=true
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  create-release:
    runs-on: ubuntu-latest
    needs: version-check
    if: needs.version-check.outputs.changed == 'true'
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/github-script@v7
        id: release
        with:
          script: |
            const tag = `v${{ needs.version-check.outputs.version }}`;
            const { owner, repo } = context.repo;
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!release) {
              try {
                await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.git.createRef({
                    owner,
                    repo,
                    ref: `refs/tags/${tag}`,
                    sha: context.sha,
                  });
                } else {
                  throw error;
                }
              }
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                generate_release_notes: true,
              });
            }
            core.setOutput("release_id", release.data.id.toString());

  build:
    runs-on: ${{ matrix.os }}
    needs: [version-check, create-release]
    if: needs.version-check.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
